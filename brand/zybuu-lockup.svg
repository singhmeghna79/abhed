<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 128" role="img"
     aria-label="Zybuu — AI that never leaves home">
  <title>Zybuu</title>

  <defs>
    <linearGradient id="zl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#3FA9F5"/>
      <stop offset="55%"  stop-color="#1F6FB8"/>
      <stop offset="100%" stop-color="#123E6B"/>
    </linearGradient>
    <linearGradient id="zl-lift" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Mark, at the same proportions as zybuu-mark.svg so the two never drift. -->
  <g transform="translate(8,12) scale(0.4)">
    <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#zl)"/>
    <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#zl-lift)"/>
    <g fill="#FFFFFF">
      <rect x="66" y="72" width="124" height="27" rx="5"/>
      <path d="M152 105 H190 L104 151 H66 Z"/>
      <rect x="66" y="157" width="124" height="27" rx="5"/>
    </g>
  </g>

  <!-- Wordmark and tagline are live text rather than outlined paths: this file
       is used on the web, where the system font stack keeps it crisp at any
       size and matches the rest of the site. A print lockup would outline
       these instead. -->
  <text x="122" y="60"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,Roboto,sans-serif"
        font-size="42" font-weight="680" letter-spacing="-1.1"
        fill="currentColor">Zybuu</text>

  <text x="124" y="88"
        font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace"
        font-size="13.5" letter-spacing="0.6" fill="#697786"
        >AI that never leaves home</text>
</svg>
