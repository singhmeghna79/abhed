<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 128" role="img"
     aria-label="Zybuu — Own your intelligence.">
  <title>Zybuu</title>

  <defs>
    <linearGradient id="zl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#2BF5C4"/>
      <stop offset="48%"  stop-color="#2E9BE8"/>
      <stop offset="100%" stop-color="#1B4FA8"/>
    </linearGradient>
    <radialGradient id="zl-core" cx="50%" cy="42%" r="70%">
      <stop offset="0%"   stop-color="#132A47"/>
      <stop offset="100%" stop-color="#080D18"/>
    </radialGradient>
  </defs>

  <!-- Mark, at the same proportions as zybuu-mark.svg so the two never drift. -->
  <g transform="translate(8,12) scale(0.4)">
    <rect x="12" y="12" width="232" height="232" rx="64" fill="url(#zl-core)"/>
    <rect x="13.5" y="13.5" width="229" height="229" rx="62.5"
          fill="none" stroke="url(#zl)" stroke-width="9"/>
    <g fill="url(#zl)">
      <rect x="70" y="76" width="116" height="25" rx="6"/>
      <path d="M152 107 H186 L104 149 H70 Z"/>
      <rect x="70" y="155" width="116" height="25" rx="6"/>
    </g>
  </g>

  <!-- Wordmark and tagline are live text rather than outlined paths: this file
       is used on the web, where the system font stack keeps it crisp at any
       size and matches the rest of the site. A print lockup would outline
       these instead. -->
  <text x="122" y="60"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,Roboto,sans-serif"
        font-size="42" font-weight="680" letter-spacing="-1.1"
        fill="currentColor">Zybuu</text>

  <text x="124" y="88"
        font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace"
        font-size="13.5" letter-spacing="0.6" fill="#697786"
        >Own your intelligence.</text>
</svg>
