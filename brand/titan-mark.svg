<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Titan">
  <title>Titan</title>
  <desc>Two brackets around a single lit point: the harness around the model.
    The research this product rests on found the scaffold, not the model, to be
    the dominant variable, and the mark says exactly that — the brackets are
    the product, the point is what they carry.</desc>
  <defs>
    <linearGradient id="tf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#5CC4FF"/>
      <stop offset="55%"  stop-color="#2A8CF0"/>
      <stop offset="100%" stop-color="#0B3C8C"/>
    </linearGradient>
    <radialGradient id="tcore" cx="40%" cy="35%" r="70%">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="70%"  stop-color="#DDEFFF"/>
      <stop offset="100%" stop-color="#9ED2FF"/>
    </radialGradient>
    <radialGradient id="tglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#5CC4FF" stop-opacity=".5"/>
      <stop offset="100%" stop-color="#5CC4FF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Brackets rather than a ring: a ring with a dot is a target or a record
       button, and an open ring is the letter C. Two brackets are the scaffold
       and nothing else. Stroke is heavy so they hold at 16px, corners rounded
       so they belong beside the Zybuu tile. -->
  <g fill="none" stroke="url(#tf)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round">
    <path d="M104 34 H64 a20 20 0 0 0 -20 20 V202 a20 20 0 0 0 20 20 H104"/>
    <path d="M152 34 H192 a20 20 0 0 1 20 20 V202 a20 20 0 0 1 -20 20 H152"/>
  </g>
  <!-- The model: one lit point, held between them. -->
  <circle cx="128" cy="128" r="60" fill="url(#tglow)"/>
  <circle cx="128" cy="128" r="31" fill="url(#tcore)"/>
</svg>
