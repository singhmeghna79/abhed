<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Zybuu">
  <title>Zybuu</title>
  <desc>A bold Z knocked out of a lit gradient tile. Zybuu is the substrate other
    products are built on, so the mark is solid ground with the letter cut into
    it rather than a letter placed on top.</desc>
  <defs>
    <linearGradient id="zt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#5CC4FF"/>
      <stop offset="50%"  stop-color="#2A8CF0"/>
      <stop offset="100%" stop-color="#0B3C8C"/>
    </linearGradient>
    <!-- A top-left light so the tile reads as a lit surface, not a flat chip.
         Kept faint: at favicon size any stronger and it becomes a smear. -->
    <radialGradient id="zl" cx="22%" cy="18%" r="80%">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity=".26"/>
      <stop offset="60%"  stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <mask id="zcut">
      <rect width="256" height="256" fill="#fff"/>
      <!-- Three clean pieces: two rounded bars and one parallelogram. The bars
           are offset in opposite directions so the diagonal has a run, and the
           diagonal is heavier than the bars — that is what keeps it a Z and
           not an hourglass at 16px. -->
      <g fill="#000">
        <rect x="70" y="62" width="126" height="34" rx="9"/>
        <rect x="60" y="160" width="126" height="34" rx="9"/>
        <path d="M156 96 H200 L100 160 H56 Z"/>
      </g>
    </mask>
  </defs>
  <rect x="14" y="14" width="228" height="228" rx="58" fill="url(#zt)" mask="url(#zcut)"/>
  <rect x="14" y="14" width="228" height="228" rx="58" fill="url(#zl)" mask="url(#zcut)"/>
</svg>
