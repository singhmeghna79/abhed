<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Zybuu">
  <title>Zybuu</title>
  <desc>Three stacked layers forming a Z, lit from mint to blue inside a dark
    tile: the substrate other products are built on.</desc>

  <defs>
    <!-- Mint into blue into navy. The mint end is what stops this reading as
         another flat-blue B2B mark: it is the colour of something powered on,
         and it survives being shrunk to a favicon where a subtle gradient
         would collapse to a single muddy tone. -->
    <linearGradient id="zy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#2BF5C4"/>
      <stop offset="48%"  stop-color="#2E9BE8"/>
      <stop offset="100%" stop-color="#1B4FA8"/>
    </linearGradient>
    <!-- A soft inner glow so the dark core does not read as a hole. -->
    <radialGradient id="zy-core" cx="50%" cy="42%" r="70%">
      <stop offset="0%"   stop-color="#132A47"/>
      <stop offset="100%" stop-color="#080D18"/>
    </radialGradient>
  </defs>

  <!-- A dark tile with a lit edge, where Titan uses a solid hexagon.
       The hexagon is the shared vocabulary of "a component in a system" —
       Kubernetes, Docker, Terraform, Vault all sit in one — and it is right
       for Titan. Zybuu is not a component; it is what components are built on,
       so the parent gets a substrate shape. Keeping the mark dark-cored and
       lit at the edge is what separates the two at a glance while leaving them
       obviously related. -->
  <rect x="12" y="12" width="232" height="232" rx="64" fill="url(#zy-core)"/>
  <rect x="13.5" y="13.5" width="229" height="229" rx="62.5"
        fill="none" stroke="url(#zy)" stroke-width="9"/>

  <!-- Three layers, the middle one on a diagonal: a stack, and a Z.
       The middle bar is a parallelogram rather than a rotated rectangle so its
       ends stay vertical and align with the bars above and below — a rotated
       rect leaves ragged diagonal ends that look like a rendering fault at
       small sizes. The diagonal is steep on purpose: a shallower one reads
       closer to a euro sign than a Z once it is 16px wide. -->
  <g fill="url(#zy)">
    <rect x="70" y="76" width="116" height="25" rx="6"/>
    <path d="M152 107 H186 L104 149 H70 Z"/>
    <rect x="70" y="155" width="116" height="25" rx="6"/>
  </g>
</svg>
