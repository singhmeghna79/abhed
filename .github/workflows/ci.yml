name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Vet, test, vulnerabilities, site checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -count=1

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: gosec
        uses: securego/gosec@master
        with:
          args: ./...

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: site access checks
        run: node deploy/sitetests/access.test.mjs

      - name: site screen checks
        run: node deploy/sitetests/screen.test.mjs

      - name: site demo checks
        run: node deploy/sitetests/demo.test.mjs

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: inline-css check
        run: python3 deploy/sitegen/inline-css.py --check

  container:
    name: Container build and deploy checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build container image
        run: |
          if command -v podman >/dev/null 2>&1; then
            podman build -t titan:ci -f Dockerfile .
          else
            docker build -t titan:ci -f Dockerfile .
          fi

      - name: go test ./internal/deploycheck/
        run: go test ./internal/deploycheck/
