# golangci-lint v2 configuration. The default linter set plus a few that
# catch what code review keeps catching by hand. Run with `make lint`.
version: "2"
linters:
  default: standard
  enable:
    - errorlint
    - misspell
    - unconvert
    - unparam
    - gocritic
    - bodyclose
    - nilerr
  settings:
    misspell:
      locale: UK
formatters:
  enable:
    - gofmt
    - goimports
